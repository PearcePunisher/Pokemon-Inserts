[package]
name = "pokemon-inserts"
version = "0.1.0"
edition = "2021"
description = "Desktop app that turns a Limitless TCG set into printable binder inserts"

[dependencies]
eframe = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
pdf-writer = "0.12"
rfd = "0.15"
open = "5"
dirs = "5"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Image processing is painfully slow unoptimized; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
