# Builds the desktop app for macOS and Windows.
# Pushing a tag like v0.1.0 publishes a GitHub Release with the .dmg and .exe.
# Running it manually (Actions tab → Release → Run workflow) just builds and
# uploads the files as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo test
      - run: ./bundle-macos.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: desktop/dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo test
      - run: cargo build --release
      - name: Rename exe
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          cp target/release/pokemon-inserts.exe "dist/Pokemon-Inserts-$VERSION-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Download
            - **Mac** (Apple Silicon & Intel): the `.dmg`. Open it and drag the app to Applications.
              The app isn't notarized, so the first time, right-click it and choose **Open**
              (or allow it in System Settings → Privacy & Security).
            - **Windows**: the `.exe`. If SmartScreen warns, choose **More info → Run anyway**.
